<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Family Hub: Neo-Brutalist Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* --- NEO-BRUTALIST BASE RULES (iOS 9 Compatible) --- */
        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Impact", "Arial Black", sans-serif;
            background-color: #FFDE4D; /* Loud Brutalist Yellow */
            overflow: hidden;
            color: #000000;
        }
        
        p, input, span, td, th, button, select, textarea {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 700;
        }

        /* --- NEO-BRUTALIST UI HOOKS --- */
        .brutal-block {
            background: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px #000000;
            border-radius: 0px;
        }
        .brutal-btn {
            background: #38bdf8;
            color: #000000;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
        .brutal-btn:active {
            -webkit-transform: translate(2px, 2px);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* --- RETRO WINDOW HEADER TEMPLATE --- */
        .window-bar {
            background: #000000;
            color: #FFFFFF;
            height: 36px;
            line-height: 32px;
            padding: 0 10px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .window-dots {
            float: left;
            margin-top: 10px;
            margin-right: 12px;
        }
        .window-dot {
            float: left;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF5F56;
            margin-right: 5px;
            border: 1px solid #000;
        }
        .window-dot.d2 { background: #FFBD2E; }
        .window-dot.d3 { background: #27C93F; }

        /* --- USER SELECTION OVERLAY --- */
        #user-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FF6B6B;
            z-index: 9999;
            text-align: center;
            padding-top: 10%;
            display: none;
        }
        #user-overlay h1 {
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 40px;
            color: #000;
            text-shadow: 4px 4px 0px #FFF;
        }
        .user-panel {
            display: inline-block;
            width: 240px;
            padding: 24px;
            margin: 15px;
            background: #FFF;
            border: 4px solid #000;
            box-shadow: 10px 10px 0px #000;
            cursor: pointer;
        }
        .user-panel:active {
            -webkit-transform: translate(4px, 4px);
            transform: translate(4px, 4px);
            box-shadow: 6px 6px 0px #000;
        }
        .user-panel h2 { font-size: 24px; text-transform: uppercase; }

        /* --- FIREBASE CODES INPUT DECODER --- */
        #setup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9998;
            display: none;
            text-align: center;
            padding-top: 12%;
        }
        .setup-box {
            background: #4D96FF;
            display: inline-block;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }
        .setup-box input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 3px solid #000;
            margin: 20px 0;
            outline: none;
        }

        /* --- APPLICATION TOP NAV BAR --- */
        #app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: #000000;
            color: #FFFFFF;
            padding: 12px 20px;
            z-index: 100;
        }
        #app-title {
            float: left;
            font-size: 32px;
            letter-spacing: -1px;
            line-height: 50px;
        }
        .header-controls {
            float: right;
            margin-top: 4px;
        }
        .audio-btn {
            background: #FF6B6B;
            padding: 8px 14px;
            font-size: 12px;
            margin-right: 10px;
        }
        .profile-indicator {
            background: #FFF;
            color: #000;
            padding: 8px 14px;
            font-size: 12px;
            border: 2px solid #000;
            cursor: pointer;
        }

        /* --- BOTTOM NAV NAVIGATION TABS --- */
        #tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #000000;
            padding: 8px;
            z-index: 100;
        }
        .tab-btn {
            float: left;
            width: 33.333%;
            height: 64px;
            background: #FFF;
            border: 3px solid #000;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #6BCB77;
            -webkit-transform: translate(-2px, -2px);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #FFF;
        }

        /* --- SYSTEM CONTENT CORES --- */
        .view-content {
            position: absolute;
            top: 75px;
            bottom: 80px;
            left: 0;
            width: 100%;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        .view-content.active {
            display: block;
        }

        /* --- TAB 1: CALENDAR & ENGINE --- */
        .cal-layout-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }
        .cal-adder-sidebar {
            width: 28%;
            float: left;
            padding: 16px;
            background: #FF9F43;
        }
        .cal-adder-sidebar h2 {
            font-size: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .form-field {
            margin-bottom: 10px;
        }
        .form-field label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        .form-field input, .form-field select, .form-field textarea {
            width: 100%;
            padding: 10px;
            border: 3px solid #000;
            font-size: 14px;
            outline: none;
            background: #FFF;
        }
        .cal-grid-main {
            width: 70%;
            float: right;
        }
        
        /* Dynamic Calendar Engine Controls Header */
        .calendar-nav-bar {
            background: #000;
            padding: 8px;
            overflow: hidden;
        }
        .calendar-nav-btn {
            background: #FFF;
            border: 2px solid #000;
            padding: 4px 12px;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
        }
        #cal-prev-btn { float: left; }
        #cal-next-btn { float: right; }
        #calendar-month-title {
            color: #FFF;
            text-align: center;
            font-size: 16px;
            line-height: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .calendar-grid {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
        }
        .calendar-grid th {
            background: #000;
            color: #FFF;
            padding: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .calendar-grid td {
            background: #FFF;
            border: 3px solid #000;
            height: 105px;
            vertical-align: top;
            padding: 6px;
            width: 14.28%;
            position: relative;
        }
        .calendar-grid td.empty-day {
            background: rgba(0,0,0,0.05);
            border: 3px dashed rgba(0,0,0,0.2);
        }
        .day-number {
            font-size: 16px;
            font-weight: 900;
            display: block;
            margin-bottom: 4px;
        }
        .cal-event {
            font-size: 11px;
            padding: 3px 20px 3px 4px;
            border: 2px solid #000;
            margin-bottom: 3px;
            color: #000;
            position: relative;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .event-katarina { background: #B388FF; }
        .event-stevan { background: #80D8FF; }
        .event-del-btn {
            position: absolute;
            right: 2px;
            top: 2px;
            width: 14px;
            height: 14px;
            background: #000;
            color: #FFF;
            font-size: 9px;
            text-align: center;
            line-height: 12px;
            cursor: pointer;
            border: none;
        }

        /* --- TAB 2: TASKS CHECKLIST ENGINE --- */
        .tasks-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .input-group {
            width: 100%;
            margin-bottom: 25px;
            clear: both;
        }
        .input-group input {
            width: 75%;
            float: left;
            padding: 16px;
            font-size: 16px;
            border: 4px solid #000;
            outline: none;
        }
        .input-group button {
            width: 25%;
            float: left;
            padding: 16px;
            font-size: 16px;
            border-left: none;
        }
        .task-list {
            list-style: none;
            clear: both;
        }
        .task-item {
            padding: 18px;
            background: #FFF;
            margin-bottom: 12px;
            border: 3px solid #000;
            box-shadow: 6px 6px 0px #000;
            overflow: hidden;
        }
        .task-checkbox {
            width: 26px;
            height: 26px;
            float: left;
            margin-right: 16px;
            border: 3px solid #000;
            cursor: pointer;
        }
        .task-text {
            font-size: 18px;
            line-height: 26px;
            float: left;
            width: 70%;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: #888;
        }
        .task-del-btn {
            float: right;
            background: #FF6B6B;
            border: 2px solid #000;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        /* --- TAB 3: POP-ART MESSAGE BULLETIN BOARD --- */
        #bulletin-view {
            background: #10B981;
            position: absolute;
            overflow: hidden;
            padding: 0;
        }
        .board-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            width: 240px;
            background: #FFF;
            padding: 12px;
            border: 3px solid #000;
        }
        .board-controls textarea {
            width: 100%;
            height: 60px;
            border: 2px solid #000;
            padding: 6px;
            font-size: 13px;
            margin-bottom: 8px;
            resize: none;
            outline: none;
        }
        
        /* Peeking Sticky Notes Styling Framework */
        .sticky-note {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            padding: 0;
            cursor: move;
            z-index: 10;
            -webkit-transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .sticky-note.peeking {
            left: -135px !important; /* Pushed out frame bounding parameters */
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
        .sticky-note.peeking .window-bar, .sticky-note.peeking .note-body, .sticky-note.peeking .note-meta {
            opacity: 0.2;
        }
        /* Reveal a colored click edge tab visually on peeking item entries */
        .sticky-note.peeking::after {
            content: "➔";
            position: absolute;
            right: 6px;
            top: 40%;
            font-size: 18px;
            color: #000;
            font-weight: 900;
        }
        
        .note-color-1 { background: #FF9F43; }
        .note-color-2 { background: #54a0ff; }
        .note-color-3 { background: #feca57; }
        
        .note-body {
            padding: 10px;
            font-size: 13px;
            height: 95px;
            overflow: hidden;
            line-height: 1.3;
        }
        .note-meta {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            text-transform: uppercase;
            background: #000;
            color: #FFF;
            padding: 2px 6px;
        }

        #trash-bin {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 80px;
            height: 80px;
            background: #FF6B6B;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            text-align: center;
            line-height: 72px;
            font-size: 32px;
            z-index: 1;
        }
        #trash-bin.hover {
            background: #000;
            color: #FF6B6B;
        }

        /* --- REMOTE ADDITION ALERT BANNER --- */
        #remote-alert-banner {
            display: none;
            position: fixed;
            top: 75px;
            left: 0;
            width: 100%;
            background: #FF6B6B;
            border-bottom: 4px solid #000;
            box-shadow: 0 6px 0px #000;
            z-index: 500;
            padding: 12px 20px;
            text-align: center;
            font-family: "Impact", "Arial Black", sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            -webkit-animation: alertPulse 0.6s ease-in-out infinite alternate;
            animation: alertPulse 0.6s ease-in-out infinite alternate;
            cursor: pointer;
        }
        @-webkit-keyframes alertPulse {
            from { background: #FF6B6B; }
            to   { background: #FFDE4D; }
        }
        @keyframes alertPulse {
            from { background: #FF6B6B; }
            to   { background: #FFDE4D; }
        }
        @media (max-width: 768px) {
            .cal-adder-sidebar { width: 100%; float: none; margin-bottom: 20px; }
            .cal-grid-main { width: 100%; float: none; }
            .calendar-grid td { height: 75px; }
            .sticky-note { width: 130px; height: 130px; }
            .sticky-note.peeking { left: -110px !important; }
            .note-body { font-size: 11px; height: 65px; }
        }
    </style>
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <!-- 1. USER IDENTITY ACCESS ROUTER -->
    <div id="user-overlay">
        <h1>Select Operator</h1>
        <div class="user-panel brutal-block" onclick="selectUser('Home Hub')">
            <div style="font-size:40px;">🏡</div>
            <h2>Home Hub</h2>
        </div>
        <div class="user-panel brutal-block" onclick="selectUser('Katarina')">
            <div style="font-size:40px;">👩</div>
            <h2>Katarina</h2>
        </div>
        <div class="user-panel brutal-block" onclick="selectUser('Stevan')">
            <div style="font-size:40px;">👨</div>
            <h2>Stevan</h2>
        </div>
    </div>

    <!-- 2. FIREBASE CREDENTIALS SETUP -->
    <div id="setup-overlay">
        <div class="setup-box brutal-block" style="max-width:520px; width:92%;">
            <div class="window-bar"><div class="window-dots"><div class="window-dot"></div><div class="window-dot d2"></div><div class="window-dot d3"></div></div>FIREBASE CONNECT</div>
            <div style="padding:20px; background:#FFF;">
                <p style="font-size:12px; text-transform:uppercase; margin-bottom:16px;">Enter your Firebase project credentials:</p>
                <div class="form-field"><label>API Key</label><input type="text" id="fb-apiKey" placeholder="AIzaSy..."></div>
                <div class="form-field"><label>Auth Domain</label><input type="text" id="fb-authDomain" placeholder="yourapp.firebaseapp.com"></div>
                <div class="form-field"><label>Project ID</label><input type="text" id="fb-projectId" placeholder="yourapp"></div>
                <div class="form-field"><label>Storage Bucket</label><input type="text" id="fb-storageBucket" placeholder="yourapp.appspot.com"></div>
                <div class="form-field"><label>Messaging Sender ID</label><input type="text" id="fb-messagingSenderId" placeholder="123456789"></div>
                <div class="form-field"><label>App ID</label><input type="text" id="fb-appId" placeholder="1:123:web:abc..."></div>
                <button class="brutal-btn" style="width:100%; padding:14px; margin-top:8px;" onclick="processSetupString()">CONNECT</button>
            </div>
        </div>
    </div>

    <!-- REMOTE ADDITION ALERT BANNER (Home Hub only) -->
    <div id="remote-alert-banner" onclick="dismissRemoteAlert()">
        ⚠️ NEW ITEM ADDED FROM ANOTHER DEVICE — TAP TO DISMISS ⚠️
    </div>

    <!-- TOP SYSTEM STATUS CONSOLE BAR -->
    <div id="app-header">
        <div id="app-title">FAMILY_HUB.EXE</div>
        <div class="header-controls">
            <button class="brutal-btn audio-btn" id="audio-lock-btn" onclick="unlockAudioChannel()">🔈 UNMUTE CORE SOUNDS</button>
            <span class="profile-indicator" id="current-user-display" onclick="logoutUser()">User</span>
        </div>
    </div>

    <!-- 3. VIEW MATRIX RUNTIME CONTROL SWITCHES -->
    <div id="tab-bar">
        <button class="tab-btn active" id="btn-calendar" onclick="switchTab('calendar')">Calendar</button>
        <button class="tab-btn" id="btn-tasks" onclick="switchTab('tasks')">Tasks</button>
        <button class="tab-btn" id="btn-bulletin" onclick="switchTab('bulletin')">Board</button>
    </div>

    <!-- 4. APPARATUS ENGINE VIEW CARDS -->
    <!-- TAB 1: CALENDAR CONSOLE MODULE -->
    <div id="calendar-view" class="view-content active">
        <div class="cal-layout-wrapper">
            
            <div class="cal-adder-sidebar brutal-block">
                <div class="window-bar"><div class="window-dots"><div class="window-dot"></div></div>ADD_EVENT</div>
                <div style="padding:12px; background:#FFF; border-top:4px solid #000;">
                    <div class="form-field">
                        <label>Event Name</label>
                        <input type="text" id="evt-title" placeholder="Event label description...">
                    </div>
                    <div class="form-field">
                        <label>Target Day</label>
                        <select id="evt-day-select">
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Profile Track</label>
                        <select id="evt-author">
                            <option value="katarina">Katarina</option>
                            <option value="stevan">Stevan</option>
                        </select>
                    </div>
                    <button class="brutal-btn" style="width:100%; padding:12px; margin-top:8px;" onclick="addCalendarEvent()">Inject Event</button>
                </div>
            </div>

            <div class="cal-grid-main brutal-block">
                <!-- Functional Month Switcher Core Grid Header -->
                <div class="calendar-nav-bar">
                    <button class="calendar-nav-btn" id="cal-prev-btn" onclick="adjustMonth(-1)">◀ Prev</button>
                    <button class="calendar-nav-btn" id="cal-next-btn" onclick="adjustMonth(1)">Next ▶</button>
                    <div id="calendar-month-title">CALENDAR_MATRIX_DISPLAY</div>
                </div>
                <div style="padding:10px; background:#FFF; border-top:4px solid #000; overflow-x: auto;">
                    <table class="calendar-grid">
                        <thead>
                            <tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr>
                        </thead>
                        <tbody id="calendar-body-anchor">
                            <!-- Populated dynamically via Engine -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- TAB 2: SYSTEM TASKS OVERWATCH -->
    <div id="tasks-view" class="view-content">
        <div class="tasks-container">
            <div class="input-group">
                <input type="text" id="task-input" placeholder="WRITE NEW TASK STREAM INDEX...">
                <button class="brutal-btn" onclick="addNewTask()">ADD TASK</button>
            </div>
            <ul class="task-list" id="task-list-element">
                <!-- Tasks drop here dynamically -->
            </ul>
        </div>
    </div>

    <!-- TAB 3: POP-ART MESSAGE BOARD BULLETIN -->
    <div id="bulletin-view" class="view-content">
        
        <div class="board-controls brutal-block">
            <div class="window-bar">WRITE_STICKY</div>
            <div style="padding:10px; background:#FFF;">
                <textarea id="note-input" placeholder="Type memo context..."></textarea>
                <button class="brutal-btn" style="width:100%; padding:8px;" onclick="addNewStickyNote()">PIN TO BOARD</button>
            </div>
        </div>

        <!-- Interactive Trash Coordinates Bucket -->
        <div id="trash-bin">🗑️</div>
    </div>

    <!-- SYSTEM CORE AUDIO TRANSLATOR FILE ASSETS -->
    <audio id="sound-added" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" preload="auto"></audio>
    <audio id="sound-completed" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav" preload="auto"></audio>
    <audio id="sound-message" src="https://assets.mixkit.co/active_storage/sfx/1355/1355-84.wav" preload="auto"></audio>
    <audio id="sound-alert" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav" preload="auto"></audio>

    <!-- CORE DESKTOP LOGIC ENGINE - VERIFIED RETRO ES5 INFRASTRUCTURE -->
    <script>
        var currentUser = null;
        var activeTab = 'calendar';
        var activeDragElement = null;
        var startX = 0, startY = 0, initialX = 0, initialY = 0;
        
        // Runtime Storage Lists
        var calendarEvents = [];
        var taskItems = [];
        var stickyNotes = [];

        // Remote Alert Engine State
        var remoteAlertInterval = null;   // repeating sound loop handle
        var syncPollInterval = null;      // localStorage poll handle
        var lastKnownEventCount = 0;      // snapshot of event total at last check
        var lastKnownTaskCount = 0;
        var lastKnownNoteCount = 0;

        // Real-world Variable Dynamic Calendars Map
        var currentDateTime = new Date(); 
        var currentYear = currentDateTime.getFullYear();
        var currentMonth = currentDateTime.getMonth();

        var db = null; // Firestore instance, set after credentials entered

        window.onload = function() {
            var cachedUser = localStorage.getItem('family_hub_user');
            var cachedConfig = localStorage.getItem('family_hub_config');

            if (cachedUser && cachedConfig) {
                currentUser = cachedUser;
                document.getElementById('current-user-display').innerHTML = "USER: " + currentUser.toUpperCase();
                initFirebase(JSON.parse(cachedConfig));
            } else {
                document.getElementById('user-overlay').style.display = 'block';
            }
        };

        function processSetupString() {
            var config = {
                apiKey:            document.getElementById('fb-apiKey').value.trim(),
                authDomain:        document.getElementById('fb-authDomain').value.trim(),
                projectId:         document.getElementById('fb-projectId').value.trim(),
                storageBucket:     document.getElementById('fb-storageBucket').value.trim(),
                messagingSenderId: document.getElementById('fb-messagingSenderId').value.trim(),
                appId:             document.getElementById('fb-appId').value.trim()
            };

            if (!config.apiKey || !config.projectId) {
                return alert("API Key and Project ID are required.");
            }

            localStorage.setItem('family_hub_config', JSON.stringify(config));
            localStorage.setItem('family_hub_user', currentUser);

            document.getElementById('setup-overlay').style.display = 'none';
            initFirebase(config);
        }

        function initFirebase(config) {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(config);
                }
                db = firebase.firestore();
                renderFunctionalCalendar();
                startFirestoreListeners();
            } catch(e) {
                alert("Firebase connection failed: " + e.message);
            }
        }

        // Real-time listeners — replace the localStorage poll for actual sync
        function startFirestoreListeners() {
            // Calendar events
            db.collection('calendarEvents').onSnapshot(function(snapshot) {
                calendarEvents = [];
                snapshot.forEach(function(doc) {
                    calendarEvents.push(doc.data());
                });
                renderFunctionalCalendar();
                checkRemoteAlert('event');
            });

            // Tasks
            db.collection('tasks').onSnapshot(function(snapshot) {
                taskItems = [];
                snapshot.forEach(function(doc) {
                    taskItems.push(doc.data());
                });
                renderTasks();
                checkRemoteAlert('task');
            });

            // Sticky notes
            db.collection('stickyNotes').onSnapshot(function(snapshot) {
                var incoming = [];
                snapshot.forEach(function(doc) {
                    incoming.push(doc.data());
                });
                // Only spawn DOM nodes for new notes not already on board
                for (var i = 0; i < incoming.length; i++) {
                    var found = false;
                    for (var j = 0; j < stickyNotes.length; j++) {
                        if (stickyNotes[j].id === incoming[i].id) { found = true; break; }
                    }
                    if (!found) spawnStickyDOMNode(incoming[i]);
                }
                stickyNotes = incoming;
                checkRemoteAlert('note');
            });
        }

        var _initEventCount = -1;
        var _initTaskCount  = -1;
        var _initNoteCount  = -1;

        function checkRemoteAlert(type) {
            // Skip alert on the very first load (baseline snapshot)
            if (type === 'event') {
                if (_initEventCount === -1) { _initEventCount = calendarEvents.length; return; }
                if (calendarEvents.length > _initEventCount) {
                    var last = calendarEvents[calendarEvents.length - 1];
                    if (last && last.author !== currentUser && currentUser === 'Home Hub') {
                        triggerRemoteAlert(last.author);
                    }
                    _initEventCount = calendarEvents.length;
                }
            } else if (type === 'task') {
                if (_initTaskCount === -1) { _initTaskCount = taskItems.length; return; }
                if (taskItems.length > _initTaskCount) {
                    if (currentUser === 'Home Hub') triggerRemoteAlert('another device');
                    _initTaskCount = taskItems.length;
                }
            } else if (type === 'note') {
                if (_initNoteCount === -1) { _initNoteCount = stickyNotes.length; return; }
                if (stickyNotes.length > _initNoteCount) {
                    var lastNote = stickyNotes[stickyNotes.length - 1];
                    if (lastNote && lastNote.author !== currentUser && currentUser === 'Home Hub') {
                        triggerRemoteAlert(lastNote.author);
                    }
                    _initNoteCount = stickyNotes.length;
                }
            }
        }

        function selectUser(user) {
            currentUser = user;
            document.getElementById('current-user-display').innerHTML = "USER: " + user.toUpperCase();
            document.getElementById('user-overlay').style.display = 'none';

            var cachedConfig = localStorage.getItem('family_hub_config');
            if (cachedConfig) {
                localStorage.setItem('family_hub_user', currentUser);
                initFirebase(JSON.parse(cachedConfig));
            } else {
                document.getElementById('setup-overlay').style.display = 'block';
            }
        }

        function logoutUser() {
            localStorage.removeItem('family_hub_user');
            localStorage.removeItem('family_hub_config');
            dismissRemoteAlert();
            document.getElementById('user-overlay').style.display = 'block';
        }

        function switchTab(tabName) {
            activeTab = tabName;
            var views = ['calendar', 'tasks', 'bulletin'];
            for(var i=0; i < views.length; i++) {
                document.getElementById(views[i] + '-view').className = 'view-content';
                document.getElementById('btn-' + views[i]).className = 'tab-btn';
            }
            document.getElementById(tabName + '-view').className = 'view-content active';
            document.getElementById('btn-' + tabName).className = 'tab-btn active';
        }

        function unlockAudioChannel() {
            document.getElementById('sound-added').play();
            document.getElementById('sound-added').pause();
            document.getElementById('sound-completed').play();
            document.getElementById('sound-completed').pause();
            document.getElementById('sound-message').play();
            document.getElementById('sound-message').pause();
            document.getElementById('sound-alert').play();
            document.getElementById('sound-alert').pause();
            
            var btn = document.getElementById('audio-lock-btn');
            btn.style.background = '#6BCB77';
            btn.innerHTML = "🔊 CORE SOUNDS READY";
        }

        /* --- REMOTE ADDITION ALERT ENGINE (HOME HUB ONLY) --- */

        // Saves current data counts to localStorage so other devices can detect changes
        function saveSharedCounts() {
            localStorage.setItem('fh_event_count', calendarEvents.length);
            localStorage.setItem('fh_task_count', taskItems.length);
            localStorage.setItem('fh_note_count', stickyNotes.length);
            // Also stamp the writer's identity so Home Hub can tell it came from elsewhere
            localStorage.setItem('fh_last_writer', currentUser || 'unknown');
            localStorage.setItem('fh_last_write_ts', new Date().getTime());
        }

        // Starts polling localStorage every 3 seconds; fires alert if counts grew
        function startSyncPoll() {
            // Snapshot current counts as the baseline
            lastKnownEventCount = calendarEvents.length;
            lastKnownTaskCount  = taskItems.length;
            lastKnownNoteCount  = stickyNotes.length;

            if (syncPollInterval) clearInterval(syncPollInterval);

            syncPollInterval = setInterval(function() {
                // Only alert when the current user IS Home Hub
                if (currentUser !== 'Home Hub') return;

                var remoteEvents = parseInt(localStorage.getItem('fh_event_count') || '0', 10);
                var remoteTasks  = parseInt(localStorage.getItem('fh_task_count')  || '0', 10);
                var remoteNotes  = parseInt(localStorage.getItem('fh_note_count')  || '0', 10);
                var lastWriter   = localStorage.getItem('fh_last_writer') || '';

                // A change from a different user means a remote addition
                var remoteAdded = (remoteEvents > lastKnownEventCount ||
                                   remoteTasks  > lastKnownTaskCount  ||
                                   remoteNotes  > lastKnownNoteCount) &&
                                   lastWriter !== 'Home Hub';

                if (remoteAdded) {
                    lastKnownEventCount = remoteEvents;
                    lastKnownTaskCount  = remoteTasks;
                    lastKnownNoteCount  = remoteNotes;
                    triggerRemoteAlert(lastWriter);
                }
            }, 3000);
        }

        function triggerRemoteAlert(writerName) {
            var banner = document.getElementById('remote-alert-banner');
            var label = writerName ? writerName.toUpperCase() : 'ANOTHER USER';
            banner.innerHTML = '⚠️ NEW ITEM ADDED BY ' + label + ' — TAP TO DISMISS ⚠️';
            banner.style.display = 'block';

            // Start repeating sound every 4 seconds
            if (!remoteAlertInterval) {
                document.getElementById('sound-alert').play();
                remoteAlertInterval = setInterval(function() {
                    document.getElementById('sound-alert').play();
                }, 4000);
            }
        }

        function dismissRemoteAlert() {
            document.getElementById('remote-alert-banner').style.display = 'none';
            if (remoteAlertInterval) {
                clearInterval(remoteAlertInterval);
                remoteAlertInterval = null;
            }
        }

        /* --- INFINITE MONTH CALENDAR GENERATION ENGINE --- */
        function adjustMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderFunctionalCalendar();
        }

        function renderFunctionalCalendar() {
            var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-title').innerHTML = monthNames[currentMonth].toUpperCase() + " " + currentYear;

            var firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            var normalizedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            var selectAnchor = document.getElementById('evt-day-select');
            selectAnchor.innerHTML = "";
            
            var gridBody = document.getElementById('calendar-body-anchor');
            gridBody.innerHTML = "";

            for (var d = 1; d <= daysInMonth; d++) {
                var opt = document.createElement('option');
                opt.value = d;
                opt.innerHTML = "Day " + d;
                selectAnchor.appendChild(opt);
            }

            var row = document.createElement('tr');
            var dayCounter = 1;

            for (var i = 0; i < 7; i++) {
                if (i < normalizedFirstDay) {
                    var cell = document.createElement('td');
                    cell.className = "empty-day";
                    row.appendChild(cell);
                } else {
                    row.appendChild(createCalendarDayCell(dayCounter));
                    dayCounter++;
                }
            }
            gridBody.appendChild(row);

            while (dayCounter <= daysInMonth) {
                var nextRow = document.createElement('tr');
                for (var j = 0; j < 7; j++) {
                    if (dayCounter <= daysInMonth) {
                        nextRow.appendChild(createCalendarDayCell(dayCounter));
                        dayCounter++;
                    } else {
                        var emptyCell = document.createElement('td');
                        emptyCell.className = "empty-day";
                        nextRow.appendChild(emptyCell);
                    }
                }
                gridBody.appendChild(nextRow);
            }
        }

        function createCalendarDayCell(dayNum) {
            var cell = document.createElement('td');
            cell.id = "cal-day-node-" + dayNum;
            cell.innerHTML = '<span class="day-number">' + dayNum + '</span>';
            
            for (var i = 0; i < calendarEvents.length; i++) {
                var ev = calendarEvents[i];
                // Confirm matches cross structural parameters down both month and year arrays
                if (parseInt(ev.day) === dayNum && ev.month === currentMonth && ev.year === currentYear) {
                    var evDiv = document.createElement('div');
                    evDiv.className = 'cal-event event-' + ev.author;
                    evDiv.innerHTML = ev.title + '<button class="event-del-btn" onclick="deleteCalendarEvent(' + ev.id + ', event)">X</button>';
                    cell.appendChild(evDiv);
                }
            }
            return cell;
        }

        function addCalendarEvent() {
            var titleInput = document.getElementById('evt-title');
            var daySelect = document.getElementById('evt-day-select');
            var authorSelect = document.getElementById('evt-author');

            if (titleInput.value.trim() === "") return alert("Please type your event name descriptor.");

            var newEvent = {
                id: new Date().getTime(),
                title: titleInput.value,
                day: daySelect.value,
                month: currentMonth,
                year: currentYear,
                author: authorSelect.value
            };

            titleInput.value = "";
            if (db) {
                db.collection('calendarEvents').doc(String(newEvent.id)).set(newEvent);
            } else {
                calendarEvents.push(newEvent);
                renderFunctionalCalendar();
            }
            document.getElementById('sound-added').play();
        }

        function deleteCalendarEvent(eventId, eventObj) {
            if(eventObj.stopPropagation) eventObj.stopPropagation();
            
            var filteredArray = [];
            for (var i = 0; i < calendarEvents.length; i++) {
                if (calendarEvents[i].id !== eventId) {
                    filteredArray.push(calendarEvents[i]);
                }
            }
            calendarEvents = filteredArray;
            renderFunctionalCalendar();
            if (db) {
                db.collection('calendarEvents').doc(String(eventId)).delete();
            }
            document.getElementById('sound-completed').play();
        }

        /* --- CHECKLIST TRACK ENGINE --- */
        function renderTasks() {
            var listAnchor = document.getElementById('task-list-element');
            listAnchor.innerHTML = "";

            for (var i = 0; i < taskItems.length; i++) {
                var task = taskItems[i];
                var li = document.createElement('li');
                li.className = 'task-item';
                
                var checkedState = task.completed ? 'checked' : '';
                var textClass = task.completed ? 'task-text completed' : 'task-text';

                li.innerHTML = '<input type="checkbox" class="task-checkbox" ' + checkedState + ' onchange="toggleTask(' + task.id + ')">' +
                               '<span class="' + textClass + '">' + task.text + '</span>' +
                               '<button class="task-del-btn" onclick="deleteTask(' + task.id + ')">DELETE</button>';
                listAnchor.appendChild(li);
            }
        }

        function addNewTask() {
            var input = document.getElementById('task-input');
            if (input.value.trim() === "") return;

            var newTask = {
                id: new Date().getTime(),
                text: input.value,
                completed: false
            };

            input.value = "";
            if (db) {
                db.collection('tasks').doc(String(newTask.id)).set(newTask);
            } else {
                taskItems.push(newTask);
                renderTasks();
            }
            document.getElementById('sound-added').play();
        }

        function toggleTask(taskId) {
            for (var i = 0; i < taskItems.length; i++) {
                if (taskItems[i].id === taskId) {
                    taskItems[i].completed = !taskItems[i].completed;
                    if (taskItems[i].completed) {
                        document.getElementById('sound-completed').play();
                    }
                    break;
                }
            }
            if (db) {
                db.collection('tasks').doc(String(taskId)).set(taskItems[i < taskItems.length ? i : 0]);
                // re-fetch handled by listener; just update local and re-render
                for (var k = 0; k < taskItems.length; k++) {
                    if (taskItems[k].id === taskId) {
                        db.collection('tasks').doc(String(taskId)).update({completed: taskItems[k].completed});
                        break;
                    }
                }
            }
            renderTasks();
        }

        function deleteTask(taskId) {
            var filtered = [];
            for (var i = 0; i < taskItems.length; i++) {
                if (taskItems[i].id !== taskId) {
                    filtered.push(taskItems[i]);
                }
            }
            taskItems = filtered;
            renderTasks();
            if (db) {
                db.collection('tasks').doc(String(taskId)).delete();
            }
            document.getElementById('sound-completed').play();
        }

        /* --- PEEKING STICKY NOTE HANDLERS --- */
        function addNewStickyNote() {
            var textarea = document.getElementById('note-input');
            if (textarea.value.trim() === "") return alert("Please type structural text content data lines.");

            var noteId = new Date().getTime();
            var randomColorIndex = Math.floor(Math.random() * 3) + 1;
            
            // Calculate a safe default top coordinate line map
            var randomTop = Math.floor(Math.random() * (window.innerHeight - 340)) + 120;

            var noteObj = {
                id: noteId,
                text: textarea.value,
                author: currentUser || "HUB",
                color: randomColorIndex,
                left: 0, // Starts aligned completely over peeking track structures
                top: randomTop,
                peeking: true
            };

            textarea.value = "";
            if (db) {
                db.collection('stickyNotes').doc(String(noteObj.id)).set(noteObj);
                stickyNotes.push(noteObj);
                spawnStickyDOMNode(noteObj);
            } else {
                stickyNotes.push(noteObj);
                spawnStickyDOMNode(noteObj);
            }
            document.getElementById('sound-message').play();
        }

        function spawnStickyDOMNode(note) {
            var div = document.createElement('div');
            div.className = 'sticky-note peeking note-color-' + note.color;
            div.id = "sticky-node-id-" + note.id;
            div.style.left = '0px';
            div.style.top = note.top + 'px';
            
            div.setAttribute('ontouchstart', 'initDrag(event)');
            div.setAttribute('onmousedown', 'initDrag(event)');
            div.setAttribute('onclick', 'handleStickyClick(event)');

            div.innerHTML = '<div class="window-bar"><div class="window-dots"><div class="window-dot"></div></div>MEMO</div>' +
                            '<div class="note-body">' + note.text + '</div>' +
                            '<div class="note-meta">' + note.author + '</div>';
            
            document.getElementById('bulletin-view').appendChild(div);
        }

        function handleStickyClick(e) {
            var element = e.currentTarget;
            if (element.className.indexOf('peeking') !== -1) {
                // Clear out peeking lock state array properties instantly to release item tracking
                element.className = element.className.replace(' peeking', '');
                element.style.left = '160px'; // Pops cleanly out onto canvas view track matrices
                
                var elementIdString = element.id.replace("sticky-node-id-", "");
                var numericId = parseInt(elementIdString);
                for (var i = 0; i < stickyNotes.length; i++) {
                    if (stickyNotes[i].id === numericId) {
                        stickyNotes[i].peeking = false;
                        stickyNotes[i].left = 160;
                        break;
                    }
                }
                document.getElementById('sound-message').play();
            }
        }

        /* --- TOUCH POINTER TRANSLATE ENGINE FOR RETRO SAFARI CORES --- */
        function initDrag(e) {
            var targetNode = e.currentTarget;
            // Prevent dragging while note is in locked peeking mode position layout
            if (targetNode.className.indexOf('peeking') !== -1) return;

            var eventObject = e.changedTouches ? e.changedTouches[0] : e;
            activeDragElement = targetNode;
            
            // Override transition locks on active moving objects instantly
            activeDragElement.style.transition = "none";
            activeDragElement.style.webkitTransition = "none";

            startX = eventObject.clientX;
            startY = eventObject.clientY;
            
            initialX = activeDragElement.offsetLeft;
            initialY = activeDragElement.offsetTop;
            
            activeDragElement.style.zIndex = 1000;

            document.addEventListener('mousemove', doDrag, false);
            document.addEventListener('mouseup', stopDrag, false);
            document.addEventListener('touchmove', doDrag, false);
            document.addEventListener('touchend', stopDrag, false);
        }

        function doDrag(e) {
            if(!activeDragElement) return;
            e.preventDefault(); 
            
            var eventObject = e.changedTouches ? e.changedTouches[0] : e;
            var deltaX = eventObject.clientX - startX;
            var deltaY = eventObject.clientY - startY;
            
            activeDragElement.style.left = (initialX + deltaX) + 'px';
            activeDragElement.style.top = (initialY + deltaY) + 'px';

            var trash = document.getElementById('trash-bin');
            var trashRect = trash.getBoundingClientRect();
            
            if(eventObject.clientX > trashRect.left && eventObject.clientX < trashRect.right &&
               eventObject.clientY > trashRect.top && eventObject.clientY < trashRect.bottom) {
                trash.className = "hover";
            } else {
                trash.className = "";
            }
        }

        function stopDrag(e) {
            if(!activeDragElement) return;
            
            var eventObject = e.changedTouches ? e.changedTouches[0] : e;
            var trash = document.getElementById('trash-bin');
            var trashRect = trash.getBoundingClientRect();
            
            if(eventObject.clientX > trashRect.left && eventObject.clientX < trashRect.right &&
               eventObject.clientY > trashRect.top && eventObject.clientY < trashRect.bottom) {
                
                var elementIdString = activeDragElement.id.replace("sticky-node-id-", "");
                var numericId = parseInt(elementIdString);

                var filteredNotes = [];
                for (var i = 0; i < stickyNotes.length; i++) {
                    if (stickyNotes[i].id !== numericId) {
                        filteredNotes.push(stickyNotes[i]);
                    }
                }
                stickyNotes = filteredNotes;

                if (db) {
                    db.collection('stickyNotes').doc(String(numericId)).delete();
                }
                activeDragElement.parentNode.removeChild(activeDragElement);
                document.getElementById('sound-completed').play();
            } else {
                activeDragElement.style.zIndex = 10;
                // Re-apply pop structural cubic motion animation matrices safely back
                activeDragElement.style.transition = "left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                activeDragElement.style.webkitTransition = "left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            }
            
            trash.className = "";
            activeDragElement = null;
            
            document.removeEventListener('mousemove', doDrag, false);
            document.removeEventListener('mouseup', stopDrag, false);
            document.removeEventListener('touchmove', doDrag, false);
            document.removeEventListener('touchend', stopDrag, false);
        }
    </script>
