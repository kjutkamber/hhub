<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Family Hub: Neo-Brutalist Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* --- NEO-BRUTALIST BASE RULES (iOS 9 Compatible) --- */
        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Impact", "Arial Black", sans-serif;
            background-color: #FFDE4D; /* Loud Brutalist Yellow */
            overflow: hidden;
            color: #000000;
        }
        
        p, input, span, td, th, button, select, textarea {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 700;
        }

        /* --- NEO-BRUTALIST UI HOOKS --- */
        .brutal-block {
            background: #FFFFFF;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px #000000;
            border-radius: 0px;
        }
        .brutal-btn {
            background: #38bdf8;
            color: #000000;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
        .brutal-btn:active {
            -webkit-transform: translate(2px, 2px);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        /* --- RETRO WINDOW HEADER TEMPLATE --- */
        .window-bar {
            background: #000000;
            color: #FFFFFF;
            height: 36px;
            line-height: 32px;
            padding: 0 10px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .window-dots {
            float: left;
            margin-top: 10px;
            margin-right: 12px;
        }
        .window-dot {
            float: left;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF5F56;
            margin-right: 5px;
            border: 1px solid #000;
        }
        .window-dot.d2 { background: #FFBD2E; }
        .window-dot.d3 { background: #27C93F; }

        /* --- USER SELECTION OVERLAY --- */
        #user-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FF6B6B;
            z-index: 9999;
            text-align: center;
            padding-top: 10%;
            display: none;
        }
        #user-overlay h1 {
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 40px;
            color: #000;
            text-shadow: 4px 4px 0px #FFF;
        }
        .user-panel {
            display: inline-block;
            width: 240px;
            padding: 24px;
            margin: 15px;
            background: #FFF;
            border: 4px solid #000;
            box-shadow: 10px 10px 0px #000;
            cursor: pointer;
        }
        .user-panel:active {
            -webkit-transform: translate(4px, 4px);
            transform: translate(4px, 4px);
            box-shadow: 6px 6px 0px #000;
        }
        .user-panel h2 { font-size: 24px; text-transform: uppercase; }

        /* --- FIREBASE CODES INPUT DECODER --- */
        #setup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9998;
            display: none;
            text-align: center;
            padding-top: 12%;
        }
        .setup-box {
            background: #4D96FF;
            display: inline-block;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }
        .setup-box input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 3px solid #000;
            margin: 20px 0;
            outline: none;
        }

        /* --- APPLICATION TOP NAV BAR --- */
        #app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: #000000;
            color: #FFFFFF;
            padding: 12px 20px;
            z-index: 100;
        }
        #app-title {
            float: left;
            font-size: 32px;
            letter-spacing: -1px;
            line-height: 50px;
        }
        .header-controls {
            float: right;
            margin-top: 4px;
        }
        .audio-btn {
            background: #FF6B6B;
            padding: 8px 14px;
            font-size: 12px;
            margin-right: 10px;
        }
        .profile-indicator {
            background: #FFF;
            color: #000;
            padding: 8px 14px;
            font-size: 12px;
            border: 2px solid #000;
            cursor: pointer;
        }

        /* --- BOTTOM NAV NAVIGATION TABS --- */
        #tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #000000;
            padding: 8px;
            z-index: 100;
        }
        .tab-btn {
            float: left;
            width: 33.333%;
            height: 64px;
            background: #FFF;
            border: 3px solid #000;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #6BCB77;
            -webkit-transform: translate(-2px, -2px);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #FFF;
        }

        /* --- SYSTEM CONTENT CORES --- */
        .view-content {
            position: absolute;
            top: 75px;
            bottom: 80px;
            left: 0;
            width: 100%;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        .view-content.active {
            display: block;
        }

        /* --- TAB 1: CALENDAR & ENGINE --- */
        .cal-layout-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }
        .cal-adder-sidebar {
            width: 28%;
            float: left;
            padding: 16px;
            background: #FF9F43;
        }
        .cal-adder-sidebar h2 {
            font-size: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .form-field {
            margin-bottom: 10px;
        }
        .form-field label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        .form-field input, .form-field select, .form-field textarea {
            width: 100%;
            padding: 10px;
            border: 3px solid #000;
            font-size: 14px;
            outline: none;
            background: #FFF;
        }
        .cal-grid-main {
            width: 70%;
            float: right;
        }
        
        /* Dynamic Calendar Engine Controls Header */
        .calendar-nav-bar {
            background: #000;
            padding: 8px;
            overflow: hidden;
        }
        .calendar-nav-btn {
            background: #FFF;
            border: 2px solid #000;
            padding: 4px 12px;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
        }
        #cal-prev-btn { float: left; }
        #cal-next-btn { float: right; }
        #calendar-month-title {
            color: #FFF;
            text-align: center;
            font-size: 16px;
            line-height: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .calendar-grid {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
        }
        .calendar-grid th {
            background: #000;
            color: #FFF;
            padding: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .calendar-grid td {
            background: #FFF;
            border: 3px solid #000;
            height: 105px;
            vertical-align: top;
            padding: 6px;
            width: 14.28%;
            position: relative;
        }
        .calendar-grid td.empty-day {
            background: rgba(0,0,0,0.05);
            border: 3px dashed rgba(0,0,0,0.2);
        }
        .day-number {
            font-size: 16px;
            font-weight: 900;
            display: block;
            margin-bottom: 4px;
        }
        .cal-event {
            font-size: 11px;
            padding: 3px 20px 3px 4px;
            border: 2px solid #000;
            margin-bottom: 3px;
            color: #000;
            position: relative;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .event-katarina { background: #B388FF; }
        .event-stevan { background: #80D8FF; }
        .event-del-btn {
            position: absolute;
            right: 2px;
            top: 2px;
            width: 14px;
            height: 14px;
            background: #000;
            color: #FFF;
            font-size: 9px;
            text-align: center;
            line-height: 12px;
            cursor: pointer;
            border: none;
        }

        /* --- TAB 2: TASKS CHECKLIST ENGINE --- */
        .tasks-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .input-group {
            width: 100%;
            margin-bottom: 25px;
            clear: both;
        }
        .input-group input {
            width: 75%;
            float: left;
            padding: 16px;
            font-size: 16px;
            border: 4px solid #000;
            outline: none;
        }
        .input-group button {
            width: 25%;
            float: left;
            padding: 16px;
            font-size: 16px;
            border-left: none;
        }
        .task-list {
            list-style: none;
            clear: both;
        }
        .task-item {
            padding: 18px;
            background: #FFF;
            margin-bottom: 12px;
            border: 3px solid #000;
            box-shadow: 6px 6px 0px #000;
            overflow: hidden;
        }
        .task-checkbox {
            width: 26px;
            height: 26px;
            float: left;
            margin-right: 16px;
            border: 3px solid #000;
            cursor: pointer;
        }
        .task-text {
            font-size: 18px;
            line-height: 26px;
            float: left;
            width: 70%;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: #888;
        }
        .task-del-btn {
            float: right;
            background: #FF6B6B;
            border: 2px solid #000;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .task-due {
            display: block;
            clear: both;
            font-size: 12px;
            color: #555;
            padding-top: 6px;
            font-family: Helvetica, Arial, sans-serif;
        }
        .task-due.urgent { color: #FF0000; font-weight: 900; }
        .task-due.overdue { color: #FF0000; text-decoration: line-through; }

        /* --- TAB 3: POP-ART MESSAGE BULLETIN BOARD --- */
        #bulletin-view {
            background: #10B981;
            position: absolute;
            overflow: hidden;
            padding: 0;
        }
        .board-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            width: 240px;
            background: #FFF;
            padding: 12px;
            border: 3px solid #000;
        }
        .board-controls textarea {
            width: 100%;
            height: 60px;
            border: 2px solid #000;
            padding: 6px;
            font-size: 13px;
            margin-bottom: 8px;
            resize: none;
            outline: none;
        }
        
        /* Peeking Sticky Notes Styling Framework */
        .sticky-note {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            padding: 0;
            cursor: move;
            z-index: 10;
            -webkit-transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        
        .note-color-1 { background: #FF9F43; }
        .note-color-2 { background: #54a0ff; }
        .note-color-3 { background: #feca57; }
        
        .note-body {
            padding: 10px;
            font-size: 13px;
            height: 95px;
            overflow: hidden;
            line-height: 1.3;
        }
        .note-meta {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            text-transform: uppercase;
            background: #000;
            color: #FFF;
            padding: 2px 6px;
        }

        #trash-bin {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 80px;
            height: 80px;
            background: #FF6B6B;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            text-align: center;
            line-height: 72px;
            font-size: 32px;
            z-index: 1;
        }
        #trash-bin.hover {
            background: #000;
            color: #FF6B6B;
        }

        /* --- CENTRE-SCREEN NOTIFICATION OVERLAY --- */
        #remote-alert-banner {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: 9000;
            cursor: pointer;
        }
        #remote-alert-inner {
            position: absolute;
            top: 50%; left: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            background: #FF6B6B;
            border: 5px solid #000;
            box-shadow: 10px 10px 0px #000;
            padding: 32px 40px;
            text-align: center;
            font-family: "Impact", "Arial Black", sans-serif;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            min-width: 260px;
            max-width: 80%;
            -webkit-animation: alertPulse 0.6s ease-in-out infinite alternate;
            animation: alertPulse 0.6s ease-in-out infinite alternate;
        }
        #remote-alert-inner p { font-size: 13px; margin-top: 10px; font-family: Helvetica, Arial, sans-serif; }
        @-webkit-keyframes alertPulse {
            from { background: #FF6B6B; }
            to   { background: #FFDE4D; }
        }
        @keyframes alertPulse {
            from { background: #FF6B6B; }
            to   { background: #FFDE4D; }
        }
        /* --- HORIZONTAL TABLET OPTIMISATION --- */
        @media (max-width: 900px) and (orientation: landscape) {
            #app-header { height: 50px; padding: 6px 12px; }
            #app-title { font-size: 20px; line-height: 36px; }
            .audio-btn, .profile-indicator { padding: 5px 10px; font-size: 11px; }
            #tab-bar { height: 52px; padding: 4px; }
            .tab-btn { height: 44px; font-size: 12px; }
            .view-content { top: 50px; bottom: 52px; padding: 10px; }
            #bulletin-view { top: 50px; bottom: 52px; }
            .cal-adder-sidebar { width: 30%; float: left; margin-bottom: 0; padding: 8px; }
            .cal-grid-main { width: 68%; float: right; }
            .calendar-grid td { height: 60px; }
            .form-field input, .form-field select { padding: 6px; font-size: 12px; }
            .brutal-btn { padding: 8px; font-size: 12px; }
            .task-item { padding: 10px; margin-bottom: 8px; }
            .task-text { font-size: 14px; }
            .sticky-note { width: 140px; height: 140px; }
            .note-body { font-size: 12px; height: 80px; }
            .board-controls { width: 190px; }
            .board-controls textarea { height: 45px; font-size: 12px; }
            .tasks-container { max-width: 100%; }
            .input-group input { font-size: 13px; padding: 10px; }
            #remote-alert-banner { font-size: 14px; padding: 8px; }
            .task-due { font-size: 11px; }
        }
        @media (max-width: 768px) and (orientation: portrait) {
            .cal-adder-sidebar { width: 100%; float: none; margin-bottom: 20px; }
            .cal-grid-main { width: 100%; float: none; }
            .calendar-grid td { height: 75px; }
            .sticky-note { width: 130px; height: 130px; }
            .note-body { font-size: 11px; height: 65px; }
        }
    </style>
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 1. USER IDENTITY ACCESS ROUTER -->
    <div id="user-overlay">
        <h1>Select Operator</h1>
        <div class="user-panel brutal-block" onclick="selectUser('Home Hub')">
            <div style="font-size:40px;">🏡</div>
            <h2>Home Hub</h2>
        </div>
        <div class="user-panel brutal-block" onclick="selectUser('Katarina')">
            <div style="font-size:40px;">👩</div>
            <h2>Katarina</h2>
        </div>
        <div class="user-panel brutal-block" onclick="selectUser('Stevan')">
            <div style="font-size:40px;">👨</div>
            <h2>Stevan</h2>
        </div>
    </div>

    <!-- 2. FIREBASE CREDENTIALS SETUP -->
    <div id="setup-overlay">
        <div class="setup-box brutal-block" style="max-width:520px; width:92%;">
            <div class="window-bar"><div class="window-dots"><div class="window-dot"></div><div class="window-dot d2"></div><div class="window-dot d3"></div></div>FIREBASE CONNECT</div>
            <div style="padding:20px; background:#FFF;">
                <p style="font-size:12px; text-transform:uppercase; margin-bottom:10px;">Paste your Firebase credentials block:</p>
                <textarea id="fb-credentials-block" style="width:100%; height:160px; border:3px solid #000; padding:10px; font-size:13px; font-family:monospace; resize:none; outline:none; background:#f9f9f9;" placeholder="API Key&#10;AIzaSy...&#10;Auth Domain&#10;yourapp.firebaseapp.com&#10;Database URL&#10;https://yourapp-default-rtdb.firebaseio.com&#10;Project ID&#10;yourapp"></textarea>
                <button class="brutal-btn" style="width:100%; padding:14px; margin-top:10px;" onclick="processSetupString()">CONNECT</button>
            </div>
        </div>
    </div>

    <!-- CENTRE-SCREEN NOTIFICATION -->
    <div id="remote-alert-banner" onclick="dismissRemoteAlert()">
        <div id="remote-alert-inner">
            <div id="remote-alert-text">⚠️ NEW ITEM ADDED</div>
            <p>Tap anywhere to dismiss</p>
        </div>
    </div>

    <!-- TOP SYSTEM STATUS CONSOLE BAR -->
    <div id="app-header">
        <div id="app-title">FAMILY_HUB.EXE</div>
        <div class="header-controls">
            <button class="brutal-btn audio-btn" id="audio-lock-btn" onclick="unlockAudioChannel()">🔈 UNMUTE CORE SOUNDS</button>
            <span class="profile-indicator" id="current-user-display" onclick="logoutUser()">User</span>
        </div>
    </div>

    <!-- 3. VIEW MATRIX RUNTIME CONTROL SWITCHES -->
    <div id="tab-bar">
        <button class="tab-btn active" id="btn-calendar" onclick="switchTab('calendar')">Calendar</button>
        <button class="tab-btn" id="btn-tasks" onclick="switchTab('tasks')">Tasks</button>
        <button class="tab-btn" id="btn-bulletin" onclick="switchTab('bulletin')">Board</button>
    </div>

    <!-- 4. APPARATUS ENGINE VIEW CARDS -->
    <!-- TAB 1: CALENDAR CONSOLE MODULE -->
    <div id="calendar-view" class="view-content active">
        <div class="cal-layout-wrapper">
            
            <div class="cal-adder-sidebar brutal-block">
                <div class="window-bar"><div class="window-dots"><div class="window-dot"></div></div>ADD_EVENT</div>
                <div style="padding:12px; background:#FFF; border-top:4px solid #000;">
                    <div class="form-field">
                        <label>Event Name</label>
                        <input type="text" id="evt-title" placeholder="Event label description...">
                    </div>
                    <div class="form-field">
                        <label>Target Day</label>
                        <select id="evt-day-select">
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Profile Track</label>
                        <select id="evt-author">
                            <option value="katarina">Katarina</option>
                            <option value="stevan">Stevan</option>
                        </select>
                    </div>
                    <button class="brutal-btn" style="width:100%; padding:12px; margin-top:8px;" onclick="addCalendarEvent()">Inject Event</button>
                </div>
            </div>

            <div class="cal-grid-main brutal-block">
                <!-- Functional Month Switcher Core Grid Header -->
                <div class="calendar-nav-bar">
                    <button class="calendar-nav-btn" id="cal-prev-btn" onclick="adjustMonth(-1)">◀ Prev</button>
                    <button class="calendar-nav-btn" id="cal-next-btn" onclick="adjustMonth(1)">Next ▶</button>
                    <div id="calendar-month-title">CALENDAR_MATRIX_DISPLAY</div>
                </div>
                <div style="padding:10px; background:#FFF; border-top:4px solid #000; overflow-x: auto;">
                    <table class="calendar-grid">
                        <thead>
                            <tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr>
                        </thead>
                        <tbody id="calendar-body-anchor">
                            <!-- Populated dynamically via Engine -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- TAB 2: SYSTEM TASKS OVERWATCH -->
    <div id="tasks-view" class="view-content">
        <div class="tasks-container">
            <div class="input-group">
                <input type="text" id="task-input" placeholder="WRITE NEW TASK STREAM INDEX..." style="width:60%; float:left;">
                <input type="time" id="task-due-time" style="width:15%; float:left; padding:16px 4px; font-size:13px; border:4px solid #000; border-left:none; outline:none; background:#fff;">
                <button class="brutal-btn" onclick="addNewTask()" style="width:25%; float:left; border-left:none;">ADD TASK</button>
            </div>
            <ul class="task-list" id="task-list-element">
                <!-- Tasks drop here dynamically -->
            </ul>
        </div>
    </div>

    <!-- TAB 3: POP-ART MESSAGE BOARD BULLETIN -->
    <div id="bulletin-view" class="view-content">
        
        <div class="board-controls brutal-block">
            <div class="window-bar">WRITE_STICKY</div>
            <div style="padding:10px; background:#FFF;">
                <textarea id="note-input" placeholder="Type memo context..."></textarea>
                <button class="brutal-btn" style="width:100%; padding:8px;" onclick="addNewStickyNote()">PIN TO BOARD</button>
            </div>
        </div>

        <!-- Interactive Trash Coordinates Bucket -->
        <div id="trash-bin">🗑️</div>
    </div>

    <!-- SYSTEM CORE AUDIO TRANSLATOR FILE ASSETS -->

    <!-- CORE DESKTOP LOGIC ENGINE - VERIFIED RETRO ES5 INFRASTRUCTURE -->
    <script>
        var currentUser = null;
        var activeTab = 'calendar';
        var activeDragElement = null;
        var startX = 0, startY = 0, initialX = 0, initialY = 0;
        
        // Runtime Storage Lists
        var calendarEvents = [];
        var taskItems = [];
        var stickyNotes = [];

        // Remote Alert Engine State
        var remoteAlertInterval = null;   // repeating sound loop handle
        var syncPollInterval = null;      // localStorage poll handle
        var lastKnownEventCount = 0;      // snapshot of event total at last check
        var lastKnownTaskCount = 0;
        var lastKnownNoteCount = 0;

        // Real-world Variable Dynamic Calendars Map
        var currentDateTime = new Date(); 
        var currentYear = currentDateTime.getFullYear();
        var currentMonth = currentDateTime.getMonth();

        var db = null; // Firebase Realtime Database instance, set after credentials entered

        window.onload = function() {
            var cachedUser = localStorage.getItem('family_hub_user');
            var cachedConfig = localStorage.getItem('family_hub_config');

            if (cachedUser && cachedConfig) {
                currentUser = cachedUser;
                document.getElementById('current-user-display').innerHTML = "USER: " + currentUser.toUpperCase();
                initFirebase(JSON.parse(cachedConfig));
            } else {
                document.getElementById('user-overlay').style.display = 'block';
            }
        };

        function processSetupString() {
            var raw = document.getElementById('fb-credentials-block').value;

            // Split into non-empty lines, strip backticks/whitespace
            var lines = raw.split(/\r?\n/).map(function(l) {
                return l.trim().replace(/`/g, '');
            }).filter(function(l) { return l !== ''; });

            // Build a map: normalised label -> next line value
            var map = {};
            var knownLabels = { 'api key': 'apiKey', 'auth domain': 'authDomain', 'database url': 'databaseURL', 'project id': 'projectId' };
            for (var i = 0; i < lines.length - 1; i++) {
                var norm = lines[i].toLowerCase().replace(/\s+/g, ' ');
                if (knownLabels[norm]) {
                    map[knownLabels[norm]] = lines[i + 1].trim();
                }
            }

            var config = {
                apiKey:      map.apiKey      || '',
                authDomain:  map.authDomain  || '',
                databaseURL: map.databaseURL || '',
                projectId:   map.projectId   || ''
            };

            if (!config.apiKey || !config.databaseURL) {
                return alert("Could not read credentials. Paste the block with each label on one line and its value on the next.");
            }

            localStorage.setItem('family_hub_config', JSON.stringify(config));
            localStorage.setItem('family_hub_user', currentUser);

            document.getElementById('setup-overlay').style.display = 'none';
            initFirebase(config);
        }

        function initFirebase(config) {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(config);
                }
                db = firebase.database();
                renderFunctionalCalendar();
                startRTDBListeners();
            } catch(e) {
                alert("Firebase connection failed: " + e.message);
            }
        }

        var _loaded = { events: false, tasks: false, notes: false };

        function startRTDBListeners() {
            // Calendar events
            db.ref('calendarEvents').on('value', function(snapshot) {
                var data = snapshot.val() || {};
                calendarEvents = [];
                for (var key in data) { calendarEvents.push(data[key]); }
                renderFunctionalCalendar();
                if (_loaded.events) {
                    checkRemoteAlert('event');
                } else {
                    _loaded.events = true;
                }
            });

            // Tasks
            db.ref('tasks').on('value', function(snapshot) {
                var data = snapshot.val() || {};
                taskItems = [];
                for (var key in data) { taskItems.push(data[key]); }
                renderTasks();
                if (_loaded.tasks) {
                    checkRemoteAlert('task');
                } else {
                    _loaded.tasks = true;
                }
            });

            // Sticky notes — load all first, then watch for new ones
            db.ref('stickyNotes').once('value', function(snapshot) {
                var data = snapshot.val() || {};
                // Clear board and re-spawn all existing notes
                var board = document.getElementById('bulletin-view');
                var existing = board.querySelectorAll('.sticky-note');
                for (var e = 0; e < existing.length; e++) { board.removeChild(existing[e]); }
                stickyNotes = [];
                for (var key in data) {
                    stickyNotes.push(data[key]);
                    spawnStickyDOMNode(data[key]);
                }
                _loaded.notes = true;

                // Watch for new notes
                db.ref('stickyNotes').on('child_added', function(snap) {
                    var note = snap.val();
                    var found = false;
                    for (var i = 0; i < stickyNotes.length; i++) {
                        if (String(stickyNotes[i].id) === String(note.id)) { found = true; break; }
                    }
                    if (!found) {
                        stickyNotes.push(note);
                        spawnStickyDOMNode(note);
                        if (_loaded.notes) checkRemoteAlert('note', note);
                    }
                });

                // Watch for deletions — removes DOM node on all devices
                db.ref('stickyNotes').on('child_removed', function(snap) {
                    var noteId = String(snap.key);
                    var el = document.getElementById('sticky-node-id-' + noteId);
                    if (el && el.parentNode) el.parentNode.removeChild(el);
                    var filtered = [];
                    for (var i = 0; i < stickyNotes.length; i++) {
                        if (String(stickyNotes[i].id) !== noteId) filtered.push(stickyNotes[i]);
                    }
                    stickyNotes = filtered;
                });

                // Watch for position changes (moves from other devices)
                db.ref('stickyNotes').on('child_changed', function(snap) {
                    var note = snap.val();
                    var el = document.getElementById('sticky-node-id-' + note.id);
                    if (el && !activeDragElement) {
                        // Only update if we're not the one dragging it
                        el.style.left = (note.left || 0) + 'px';
                        el.style.top  = (note.top  || 0) + 'px';
                    }
                });
            });

            startDeadlineChecker();
        }

        function checkRemoteAlert(type, item) {
            if (currentUser !== 'Home Hub') return;
            if (type === 'event') {
                var last = calendarEvents[calendarEvents.length - 1];
                if (last && last.addedBy && last.addedBy !== 'Home Hub') triggerRemoteAlert(last.addedBy);
            } else if (type === 'task') {
                var lastT = taskItems[taskItems.length - 1];
                if (lastT && lastT.addedBy && lastT.addedBy !== 'Home Hub') triggerRemoteAlert(lastT.addedBy);
            } else if (type === 'note' && item) {
                if (item.author && item.author !== 'Home Hub') triggerRemoteAlert(item.author);
            }
        }

        function selectUser(user) {
            currentUser = user;
            document.getElementById('current-user-display').innerHTML = "USER: " + user.toUpperCase();
            document.getElementById('user-overlay').style.display = 'none';

            var cachedConfig = localStorage.getItem('family_hub_config');
            if (cachedConfig) {
                localStorage.setItem('family_hub_user', currentUser);
                initFirebase(JSON.parse(cachedConfig));
            } else {
                document.getElementById('setup-overlay').style.display = 'block';
            }
        }

        function logoutUser() {
            localStorage.removeItem('family_hub_user');
            localStorage.removeItem('family_hub_config');
            dismissRemoteAlert();
            document.getElementById('user-overlay').style.display = 'block';
        }

        function switchTab(tabName) {
            activeTab = tabName;
            var views = ['calendar', 'tasks', 'bulletin'];
            for(var i=0; i < views.length; i++) {
                document.getElementById(views[i] + '-view').className = 'view-content';
                document.getElementById('btn-' + views[i]).className = 'tab-btn';
            }
            document.getElementById(tabName + '-view').className = 'view-content active';
            document.getElementById('btn-' + tabName).className = 'tab-btn active';
        }

        var audioCtx = null;
        var audioUnlocked = false;
        var chimeInterval = null;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // Play a simple chime: freq Hz, duration seconds
        function playBeep(freq, duration, volume) {
            try {
                var ctx = getAudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq || 880;
                gain.gain.setValueAtTime(volume || 0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration || 0.4));
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + (duration || 0.4));
            } catch(e) {}
        }

        function safePlay(soundId) {
            if (!audioUnlocked) return;
            // Map old sound IDs to distinct tones
            if (soundId === 'sound-added')     { playBeep(880, 0.3, 0.4); }
            if (soundId === 'sound-completed') { playBeep(1046, 0.3, 0.4); setTimeout(function(){ playBeep(1318, 0.3, 0.3); }, 150); }
            if (soundId === 'sound-message')   { playBeep(659, 0.4, 0.4); }
            if (soundId === 'sound-alert')     { playBeep(523, 0.15, 0.5); setTimeout(function(){ playBeep(659, 0.15, 0.5); }, 180); setTimeout(function(){ playBeep(784, 0.3, 0.5); }, 360); }
        }

        function startChime() {
            if (chimeInterval) return;
            safePlay('sound-alert');
            chimeInterval = setInterval(function() {
                safePlay('sound-alert');
            }, 3000);
        }

        function stopChime() {
            if (chimeInterval) { clearInterval(chimeInterval); chimeInterval = null; }
        }

        function unlockAudioChannel() {
            try {
                var ctx = getAudioCtx();
                // iOS requires resume() inside a user gesture
                ctx.resume().then(function() { audioUnlocked = true; });
                // Play a silent buffer to fully unlock on older iOS
                var buf = ctx.createBuffer(1, 1, 22050);
                var src = ctx.createBufferSource();
                src.buffer = buf;
                src.connect(ctx.destination);
                src.start(0);
                audioUnlocked = true;
            } catch(e) { audioUnlocked = true; }
            var btn = document.getElementById('audio-lock-btn');
            btn.style.background = '#6BCB77';
            btn.innerHTML = "🔊 SOUNDS READY";
        }

        /* --- REMOTE ADDITION ALERT ENGINE (HOME HUB ONLY) --- */

        // Saves current data counts to localStorage so other devices can detect changes
        function saveSharedCounts() {
            localStorage.setItem('fh_event_count', calendarEvents.length);
            localStorage.setItem('fh_task_count', taskItems.length);
            localStorage.setItem('fh_note_count', stickyNotes.length);
            // Also stamp the writer's identity so Home Hub can tell it came from elsewhere
            localStorage.setItem('fh_last_writer', currentUser || 'unknown');
            localStorage.setItem('fh_last_write_ts', new Date().getTime());
        }

        // Starts polling localStorage every 3 seconds; fires alert if counts grew
        function startSyncPoll() {
            // Snapshot current counts as the baseline
            lastKnownEventCount = calendarEvents.length;
            lastKnownTaskCount  = taskItems.length;
            lastKnownNoteCount  = stickyNotes.length;

            if (syncPollInterval) clearInterval(syncPollInterval);

            syncPollInterval = setInterval(function() {
                // Only alert when the current user IS Home Hub
                if (currentUser !== 'Home Hub') return;

                var remoteEvents = parseInt(localStorage.getItem('fh_event_count') || '0', 10);
                var remoteTasks  = parseInt(localStorage.getItem('fh_task_count')  || '0', 10);
                var remoteNotes  = parseInt(localStorage.getItem('fh_note_count')  || '0', 10);
                var lastWriter   = localStorage.getItem('fh_last_writer') || '';

                // A change from a different user means a remote addition
                var remoteAdded = (remoteEvents > lastKnownEventCount ||
                                   remoteTasks  > lastKnownTaskCount  ||
                                   remoteNotes  > lastKnownNoteCount) &&
                                   lastWriter !== 'Home Hub';

                if (remoteAdded) {
                    lastKnownEventCount = remoteEvents;
                    lastKnownTaskCount  = remoteTasks;
                    lastKnownNoteCount  = remoteNotes;
                    triggerRemoteAlert(lastWriter);
                }
            }, 3000);
        }

        function triggerRemoteAlert(writerName) {
            var label = writerName ? writerName.toUpperCase() : 'ANOTHER DEVICE';
            document.getElementById('remote-alert-text').innerHTML = '⚠️ NEW ITEM ADDED BY ' + label;
            document.getElementById('remote-alert-banner').style.display = 'block';
            startChime();
        }

        function dismissRemoteAlert() {
            document.getElementById('remote-alert-banner').style.display = 'none';
            stopChime();
        }

        /* --- INFINITE MONTH CALENDAR GENERATION ENGINE --- */
        function adjustMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderFunctionalCalendar();
        }

        function renderFunctionalCalendar() {
            var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-title').innerHTML = monthNames[currentMonth].toUpperCase() + " " + currentYear;

            var firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            var normalizedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            var selectAnchor = document.getElementById('evt-day-select');
            selectAnchor.innerHTML = "";
            
            var gridBody = document.getElementById('calendar-body-anchor');
            gridBody.innerHTML = "";

            for (var d = 1; d <= daysInMonth; d++) {
                var opt = document.createElement('option');
                opt.value = d;
                opt.innerHTML = "Day " + d;
                selectAnchor.appendChild(opt);
            }

            var row = document.createElement('tr');
            var dayCounter = 1;

            for (var i = 0; i < 7; i++) {
                if (i < normalizedFirstDay) {
                    var cell = document.createElement('td');
                    cell.className = "empty-day";
                    row.appendChild(cell);
                } else {
                    row.appendChild(createCalendarDayCell(dayCounter));
                    dayCounter++;
                }
            }
            gridBody.appendChild(row);

            while (dayCounter <= daysInMonth) {
                var nextRow = document.createElement('tr');
                for (var j = 0; j < 7; j++) {
                    if (dayCounter <= daysInMonth) {
                        nextRow.appendChild(createCalendarDayCell(dayCounter));
                        dayCounter++;
                    } else {
                        var emptyCell = document.createElement('td');
                        emptyCell.className = "empty-day";
                        nextRow.appendChild(emptyCell);
                    }
                }
                gridBody.appendChild(nextRow);
            }
        }

        function createCalendarDayCell(dayNum) {
            var cell = document.createElement('td');
            cell.id = "cal-day-node-" + dayNum;
            cell.innerHTML = '<span class="day-number">' + dayNum + '</span>';
            
            for (var i = 0; i < calendarEvents.length; i++) {
                var ev = calendarEvents[i];
                // Confirm matches cross structural parameters down both month and year arrays
                if (parseInt(ev.day) === dayNum && ev.month === currentMonth && ev.year === currentYear) {
                    var evDiv = document.createElement('div');
                    evDiv.className = 'cal-event event-' + ev.author;
                    evDiv.innerHTML = ev.title + '<button class="event-del-btn" onclick="deleteCalendarEvent(' + ev.id + ', event)">X</button>';
                    cell.appendChild(evDiv);
                }
            }
            return cell;
        }

        function addCalendarEvent() {
            var titleInput = document.getElementById('evt-title');
            var daySelect = document.getElementById('evt-day-select');
            var authorSelect = document.getElementById('evt-author');

            if (titleInput.value.trim() === "") return alert("Please type your event name descriptor.");

            var newEvent = {
                id: new Date().getTime(),
                title: titleInput.value,
                day: daySelect.value,
                month: currentMonth,
                year: currentYear,
                author: authorSelect.value
            };

            newEvent.addedBy = currentUser;
            titleInput.value = "";
            if (db) {
                db.ref('calendarEvents/' + newEvent.id).set(newEvent);
            } else {
                calendarEvents.push(newEvent);
                renderFunctionalCalendar();
            }
            safePlay('sound-added');
        }

        function deleteCalendarEvent(eventId, eventObj) {
            if(eventObj.stopPropagation) eventObj.stopPropagation();
            
            var filteredArray = [];
            for (var i = 0; i < calendarEvents.length; i++) {
                if (calendarEvents[i].id !== eventId) {
                    filteredArray.push(calendarEvents[i]);
                }
            }
            calendarEvents = filteredArray;
            renderFunctionalCalendar();
            if (db) {
                db.ref('calendarEvents/' + eventId).remove();
            }
            safePlay('sound-completed');
        }

        /* --- CHECKLIST TRACK ENGINE --- */
        function renderTasks() {
            var listAnchor = document.getElementById('task-list-element');
            listAnchor.innerHTML = "";
            var now = new Date();

            for (var i = 0; i < taskItems.length; i++) {
                var task = taskItems[i];
                var li = document.createElement('li');
                li.className = 'task-item';

                var checkedState = task.completed ? 'checked' : '';
                var textClass = task.completed ? 'task-text completed' : 'task-text';
                li.setAttribute('data-task-id', String(task.id));

                // Due time label
                var dueLabel = '';
                if (task.dueTime && !task.completed) {
                    var dueParts = task.dueTime.split(':');
                    var dueDate = new Date();
                    dueDate.setHours(parseInt(dueParts[0], 10), parseInt(dueParts[1], 10), 0, 0);
                    var diffMs = dueDate - now;
                    var diffMin = Math.round(diffMs / 60000);
                    var dueClass = 'task-due';
                    if (diffMin < 0) { dueClass += ' overdue'; dueLabel = '⏰ OVERDUE (' + task.dueTime + ')'; }
                    else if (diffMin <= 5) { dueClass += ' urgent'; dueLabel = '🔴 DUE IN ' + diffMin + ' MIN (' + task.dueTime + ')'; }
                    else { dueLabel = '⏱ Due: ' + task.dueTime; }
                    dueLabel = '<span class="' + dueClass + '">' + dueLabel + '</span>';
                }

                li.innerHTML = '<input type="checkbox" class="task-checkbox" ' + checkedState + '>' +
                               '<span class="' + textClass + '">' + task.text + '</span>' +
                               '<button class="task-del-btn">DEL</button>' +
                               dueLabel;

                (function(taskObj, liEl) {
                    liEl.querySelector('.task-checkbox').onchange = function() { toggleTask(String(taskObj.id)); };
                    liEl.querySelector('.task-del-btn').onclick   = function() { deleteTask(String(taskObj.id)); };
                })(task, li);

                listAnchor.appendChild(li);
            }
        }

        function addNewTask() {
            var input = document.getElementById('task-input');
            var dueInput = document.getElementById('task-due-time');
            if (input.value.trim() === "") return;

            var newTask = {
                id: String(new Date().getTime()),
                text: input.value,
                completed: false,
                addedBy: currentUser || 'unknown',
                dueTime: dueInput.value || ''
            };

            input.value = "";
            dueInput.value = "";
            if (db) {
                db.ref('tasks/' + newTask.id).set(newTask);
            } else {
                taskItems.push(newTask);
                renderTasks();
            }
            safePlay('sound-added');
        }

        // Check every 30s if any task is due in 5 minutes
        var _warnedTasks = {};
        function startDeadlineChecker() {
            setInterval(function() {
                var now = new Date();
                for (var i = 0; i < taskItems.length; i++) {
                    var t = taskItems[i];
                    if (!t.dueTime || t.completed || _warnedTasks[t.id]) continue;
                    var parts = t.dueTime.split(':');
                    var due = new Date();
                    due.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
                    var diffMin = (due - now) / 60000;
                    if (diffMin >= 0 && diffMin <= 5) {
                        _warnedTasks[t.id] = true;
                        safePlay('sound-alert');
                        renderTasks(); // refresh red label
                        // Also show a notification banner
                        document.getElementById('remote-alert-text').innerHTML = '⏰ TASK DUE SOON: ' + t.text.toUpperCase();
                        document.getElementById('remote-alert-banner').style.display = 'block';
                        startChime();
                    }
                }
            }, 30000);
        }

        function toggleTask(taskId) {
            if (db) {
                // Read current value, flip it, write back
                db.ref('tasks/' + taskId + '/completed').once('value', function(snap) {
                    var current = snap.val() || false;
                    db.ref('tasks/' + taskId + '/completed').set(!current);
                    if (!current) safePlay('sound-completed');
                });
            } else {
                for (var i = 0; i < taskItems.length; i++) {
                    if (String(taskItems[i].id) === taskId) {
                        taskItems[i].completed = !taskItems[i].completed;
                        if (taskItems[i].completed) safePlay('sound-completed');
                        break;
                    }
                }
                renderTasks();
            }
        }

        function deleteTask(taskId) {
            if (db) {
                // Firebase listener handles re-render; don't touch local array
                db.ref('tasks/' + taskId).remove();
            } else {
                var filtered = [];
                for (var i = 0; i < taskItems.length; i++) {
                    if (String(taskItems[i].id) !== taskId) filtered.push(taskItems[i]);
                }
                taskItems = filtered;
                renderTasks();
            }
            safePlay('sound-completed');
        }

        /* --- PEEKING STICKY NOTE HANDLERS --- */
        function addNewStickyNote() {
            var textarea = document.getElementById('note-input');
            if (textarea.value.trim() === "") return alert("Please type structural text content data lines.");

            var noteId = new Date().getTime();
            var randomColorIndex = Math.floor(Math.random() * 3) + 1;
            
            // Calculate a safe default top coordinate line map
            var randomTop = Math.floor(Math.random() * (window.innerHeight - 340)) + 120;

            var noteObj = {
                id: noteId,
                text: textarea.value,
                author: currentUser || "HUB",
                color: randomColorIndex,
                left: 0, // Starts aligned completely over peeking track structures
                top: randomTop,
                hidden: true
            };

            textarea.value = "";
            if (db) {
                db.ref('stickyNotes/' + noteObj.id).set(noteObj);
                // DOM spawn handled by child_added listener
            } else {
                stickyNotes.push(noteObj);
                spawnStickyDOMNode(noteObj);
            }
            safePlay('sound-message');
        }

        function spawnStickyDOMNode(note) {
            var board = document.getElementById('bulletin-view');
            var noteW = 160;
            var noteH = 160;
            // Use screen size directly — board may be hidden so offsetWidth can be 0
            var bw = window.innerWidth;
            var bh = window.innerHeight - 155; // subtract header + tab bar
            var centreLeft = (note.left !== undefined) ? note.left : Math.max(10, Math.round((bw - noteW) / 2) + Math.floor(Math.random() * 80) - 40);
            var centreTop  = (note.top  !== undefined) ? note.top  : Math.max(10, Math.round((bh - noteH) / 2) + Math.floor(Math.random() * 80) - 40);

            var div = document.createElement('div');
            div.className = 'sticky-note note-color-' + note.color; // no hidden class
            div.id = 'sticky-node-id-' + note.id;
            div.style.left = centreLeft + 'px';
            div.style.top  = centreTop  + 'px';

            div.setAttribute('ontouchstart', 'initDrag(event)');
            div.setAttribute('onmousedown', 'initDrag(event)');

            div.innerHTML = '<div class="window-bar"><div class="window-dots"><div class="window-dot"></div></div>' + note.author + '</div>' +
                            '<div class="note-body">' + note.text + '</div>';

            board.appendChild(div);
        }

        /* --- TOUCH POINTER TRANSLATE ENGINE FOR RETRO SAFARI CORES --- */
        function initDrag(e) {
            var targetNode = e.currentTarget;
            // Prevent dragging while note is in locked peeking mode position layout
            if (targetNode.className.indexOf('peeking') !== -1) return;

            var eventObject = e.changedTouches ? e.changedTouches[0] : e;
            activeDragElement = targetNode;
            
            // Override transition locks on active moving objects instantly
            activeDragElement.style.transition = "none";
            activeDragElement.style.webkitTransition = "none";

            startX = eventObject.clientX;
            startY = eventObject.clientY;
            
            initialX = activeDragElement.offsetLeft;
            initialY = activeDragElement.offsetTop;
            
            activeDragElement.style.zIndex = 1000;

            document.addEventListener('mousemove', doDrag, false);
            document.addEventListener('mouseup', stopDrag, false);
            document.addEventListener('touchmove', doDrag, false);
            document.addEventListener('touchend', stopDrag, false);
        }

        function doDrag(e) {
            if(!activeDragElement) return;
            e.preventDefault(); 
            
            var eventObject = e.changedTouches ? e.changedTouches[0] : e;
            var deltaX = eventObject.clientX - startX;
            var deltaY = eventObject.clientY - startY;
            
            activeDragElement.style.left = (initialX + deltaX) + 'px';
            activeDragElement.style.top = (initialY + deltaY) + 'px';

            var trash = document.getElementById('trash-bin');
            var trashRect = trash.getBoundingClientRect();
            
            if(eventObject.clientX > trashRect.left && eventObject.clientX < trashRect.right &&
               eventObject.clientY > trashRect.top && eventObject.clientY < trashRect.bottom) {
                trash.className = "hover";
            } else {
                trash.className = "";
            }
        }

        function stopDrag(e) {
            if(!activeDragElement) return;
            
            var eventObject = e.changedTouches ? e.changedTouches[0] : e;
            var trash = document.getElementById('trash-bin');
            var trashRect = trash.getBoundingClientRect();
            var noteId = activeDragElement.id.replace('sticky-node-id-', '');
            
            if(eventObject.clientX > trashRect.left && eventObject.clientX < trashRect.right &&
               eventObject.clientY > trashRect.top && eventObject.clientY < trashRect.bottom) {
                // Delete from Firebase — child_removed listener handles DOM removal on all devices
                if (db) {
                    db.ref('stickyNotes/' + noteId).remove();
                } else {
                    activeDragElement.parentNode.removeChild(activeDragElement);
                }
                // Remove locally immediately on this device too
                activeDragElement.parentNode.removeChild(activeDragElement);
                var filtered = [];
                for (var i = 0; i < stickyNotes.length; i++) {
                    if (String(stickyNotes[i].id) !== noteId) filtered.push(stickyNotes[i]);
                }
                stickyNotes = filtered;
                safePlay('sound-completed');
            } else {
                // Save new position to Firebase so all devices see the move
                var newLeft = parseInt(activeDragElement.style.left, 10);
                var newTop  = parseInt(activeDragElement.style.top, 10);
                if (db) {
                    db.ref('stickyNotes/' + noteId + '/left').set(newLeft);
                    db.ref('stickyNotes/' + noteId + '/top').set(newTop);
                }
                activeDragElement.style.zIndex = 10;
                activeDragElement.style.transition = "none";
                activeDragElement.style.webkitTransition = "none";
            }
            
            trash.className = "";
            activeDragElement = null;
            document.removeEventListener('mousemove', doDrag, false);
            document.removeEventListener('mouseup', stopDrag, false);
            document.removeEventListener('touchmove', doDrag, false);
            document.removeEventListener('touchend', stopDrag, false);
        }
    </script>
</body>
</html>
